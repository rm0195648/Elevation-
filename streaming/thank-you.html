
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Request Received | Elevation Entertainment</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .panel {
      max-width: 520px;
      padding: 45px 30px;
      background: #151d32;
      border: 1px solid #2b3854;
      border-radius: 20px;
    }
    .check { font-size: 48px; color: #a78bfa; }
    h1 { font-size: 28px; }
    p { color: #aab6cc; line-height: 1.7; }
    .brand {
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">ELEVATION ENTERTAINMENT.</div>
    <div class="check">✓</div>
    <h1>Request Received!</h1>
    
    <p>
      Thank you for choosing Elevation Entertainment!
    </p>
  </main>
</body>
</html>
